name: Validate static site

on:
  pull_request:
  push:
    branches: [main, develop, 'feature/**', 'release/**']

permissions:
  contents: read

jobs:
  validate:
    name: Validate reviewed static site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Test rejected artifacts
        run: node --test scripts/check-site.test.mjs
      - name: Validate actual site
        run: |
          test -d site
          touch site/.nojekyll
          node scripts/check-site.mjs site
